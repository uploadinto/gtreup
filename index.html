<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11121a">
  <meta name="description" content="Aviso sobre o encerramento do Gartic.com.br e link para jogar no Artixie.">
  <title>Gartic encerrado — Jogue no Artixie</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #11121a;
      color: #f5f5fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 480px; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 6vw, 38px); line-height: 1.15; }
    p { margin: 0 0 28px; font-size: 17px; line-height: 1.6; color: #b9bac9; }
    a {
      display: inline-block;
      padding: 15px 28px;
      border-radius: 12px;
      background: #7651ed;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s, transform .2s;
    }
    a:hover { background: #8b69f6; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>O Gartic.com.br foi encerrado</h1>
    <p>Quer continuar jogando, desenhando e adivinhando palavras? Conheça o Artixie!</p>
    <a href="https://artixie.com/">Ir para o Artixie</a>
  </main>
</body>
</html>
